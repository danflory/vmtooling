{{- if .Values.adminUiSidecar.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: admin-ui-sidecar-dsn
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "overwatch.labels" . | nindent 4 }}
    component: admin-ui-sidecar
type: Opaque
stringData:
  # Endpoint assembled from the chart's SINGLE governed source:
  #   database.agentConnection.host  (service DNS; RFC-OW-276)
  #   database.port                  (RFC-OW-103 sole source)
  # The port must not be copied as a literal into any other artifact.
  # Authority: OPF-010 "Literal ports are a violation"; GROUNDED_TRUTHS.md §Services.
  #
  # User is the agent role, not the superuser, so the RFC-OW-370 / D3 containment
  # holds (audit.ow_log_signature_change stays out of agent reach).
  # password is set at install (--set-file / --set) and never committed to git.
  FIRECONTROL_DSN: {{ printf "dbname=%s user=%s host=%s port=%v password=%s" .Values.database.credentials.postgresDb .Values.adminUiSidecar.dbUser .Values.database.agentConnection.host .Values.database.port (.Values.database.agentConnection.password | required "database.agentConnection.password is required (set at install; never committed to git)") | quote }}
{{- end }}
